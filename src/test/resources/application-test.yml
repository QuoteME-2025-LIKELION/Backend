# Test-only profile: dummy values, in-memory H2. Never put real secrets here.
spring:
  datasource:
    url: jdbc:h2:mem:quoteme_test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jackson:
    serialization:
      fail-on-empty-beans: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_batch_fetch_size: 100
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile
              - email
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  cloud:
    aws:
      s3:
        bucket: test-bucket
      region:
        static: ap-northeast-2
      credentials:
        access-key: test-access-key
        secret-key: test-secret-key

logging:
  level:
    com.ll.demo: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.orm.jdbc.extract: WARN
    org.springframework.transaction.interceptor: WARN

custom:
  oauth2:
    redirect-base: http://localhost:8080
  site:
    name: "QUOTEME TEST"
    cookieDomain: localhost
    frontUrl: "http://localhost:5173"
    backUrl: "http://localhost:8070"
  frontend:
    allowed-origins: http://localhost:3000,http://localhost:5173
  accessToken:
    expirationSec: 600
  secret:
    key: test-secret-key-dummy
    jwt:
      secretKey: test-jwt-secret-key-for-hs512-must-be-at-least-sixty-four-bytes-long-0123456789abcdef
  jwt:
    secretKey: test-jwt-secret-key-for-hs512-must-be-at-least-sixty-four-bytes-long-0123456789abcdef
  gemini:
    api-key: test-gemini-api-key
  notion:
    sync:
      enabled: false
