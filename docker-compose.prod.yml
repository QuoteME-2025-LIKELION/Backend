services:
  app:
    image: ${DOCKERHUB_USERNAME}/quoteme:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    ports:
      - "8070:8070"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_NOTICE_DATABASE_ID: ${NOTION_NOTICE_DATABASE_ID:-}
      NOTION_SYNC_ENABLED: ${NOTION_SYNC_ENABLED:-false}
      FIREBASE_CREDENTIALS_BASE64: ${FIREBASE_CREDENTIALS_BASE64:-}
      APP_OAUTH2_REDIRECT_URIS: ${APP_OAUTH2_REDIRECT_URIS:-}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8070/ || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s